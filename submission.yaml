submission:
  title: "AI Security Shield"
  problem_statement: >
    Users encounter suspicious emails, malicious links, authentication anomalies,
    and endpoint compromises every day, but existing security tools generate
    fragmented, siloed alerts requiring manual correlation. By the time analysts
    investigate individual alerts, an attack chain may already be underway.
  solution_summary: >
    AI Security Shield is an intelligent cybersecurity warning layer that ingests
    simulated security signals, normalizes them into a common format, correlates
    related signals using shared indicators (user, device, IP, domain) and time
    proximity, scores risk on a transparent 0-100 scale, classifies attack techniques
    using MITRE ATT&CK references, generates AI-powered investigation summaries via
    IBM watsonx.ai, and fires a prominent Security Shield Warning for HIGH/CRITICAL
    incidents — giving users and analysts an immediate, actionable alert before
    threats escalate.
  key_features:
    - "Intelligent Signal Correlation: Union-Find algorithm groups related signals across 5 source types by shared indicators and time proximity"
    - "Transparent Risk Scoring: 5-factor formula (severity, signal count, threat intel, confidence, time proximity) with plain-English explanations"
    - "Security Shield Warning: Unmissable HIGH/CRITICAL incident banner with risk score, evidence bullets, and recommended defensive action"
    - "AI Investigation Summary: IBM watsonx.ai Granite model generates concise BLUF summaries with reliable built-in fallback"
    - "SOC Dashboard: Dark-theme security operations center UI with live stats, risk distribution charts, and correlated incident table"
  what_we_are_most_proud_of: >
    The end-to-end demo scenario: a coordinated 5-signal attack chain (phishing email
    → malicious URL → Tor-exit-node login → PowerShell execution → threat-intel match)
    is automatically correlated into a single CRITICAL incident, scored 100/100, and
    surfaced with a full AI explanation and Security Shield Warning — all running
    locally with zero infrastructure, zero API keys required.
  known_limitations:
    - "Uses simulated/sample data only — not connected to real threat feeds"
    - "IBM watsonx.ai integration requires credentials; built-in fallback used otherwise"
    - "No persistent storage — state resets on page refresh"
    - "Single-user, single-session UI"

